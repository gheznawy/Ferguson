<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Netlify Forms</title></head>
  <body>
    <form name="service-request" method="POST" action="/netlify-forms.html" data-netlify="true" data-netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="service-request">
      <p><label>Leave this field empty: <input name="bot-field"></label></p>
      <input name="firstName" type="text">
      <input name="lastName" type="text">
      <input name="phone" type="tel">
      <input name="email" type="email">
      <select name="service"><option value="">Select a service</option></select>
      <input name="city" type="text">
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
